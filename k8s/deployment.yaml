apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      containers:
        - name: python-backend
          image: 799448219563.dkr.ecr.us-east-1.amazonaws.com/python-backend
          ports:
            - containerPort: 8000